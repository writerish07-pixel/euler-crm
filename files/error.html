<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Error · Euler Motors CRM</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div class="card card-pad" style="max-width:420px;text-align:center;">
    <h1 style="margin:0 0 8px;font-size:22px;">Something went wrong</h1>
    <p style="color:var(--muted);font-size:14px;" id="msg">The page could not be loaded. Check your connection and try again.</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;">
      <button class="btn" type="button" onclick="location.reload()">Retry</button>
      <a class="btn btn-secondary" href="dashboard.html">Dashboard</a>
    </div>
  </div>
  <script>
    var p = new URLSearchParams(location.search);
    if (p.get('m')) document.getElementById('msg').textContent = p.get('m');
  </script>
</body>
</html>
