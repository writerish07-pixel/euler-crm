# Render Blueprint.
# Frontend lives under frontend/ (Create React App + yarn.lock). Root package.json
# + wrangler.toml exist for Cloudflare Workers Builds; Render still pins rootDir
# to frontend so the static service does not depend on the root npm wrapper.
services:
  - type: web
    name: euler-crm
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    envVars:
      # Public API base only. CRA inlines REACT_APP_* into the browser bundle,
      # so no secret may ever be placed here.
      - key: REACT_APP_BACKEND_URL
        value: https://euler-crm-production.up.railway.app
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA: every client-side route must fall back to index.html or a refresh
      # on /leads, /bookings, /payments etc. returns a Render 404.
      - type: rewrite
        source: /*
        destination: /index.html
